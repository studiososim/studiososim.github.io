<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>탱구런 이메일 로그인 · Tanggu Run Email Login</title>
  <style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#174aa6,#55b8eb);color:#17324a}main{width:min(86vw,520px);padding:34px 26px;text-align:center;background:#fffdf7;border:5px solid #69bfe4;border-radius:28px;box-shadow:0 16px 45px #092f6b55}h1{margin-top:0}.button{display:block;margin:24px auto 10px;padding:18px 20px;border-radius:18px;background:#dff1ff;color:#17324a;text-decoration:none;font-size:1.2rem;font-weight:800}.error{color:#a22626}small{display:block;margin-top:18px;color:#526b7c}</style>
</head>
<body><main>
  <h1>탱구런 이메일 로그인</h1>
  <p id="message">이메일 인증이 완료되었습니다. 아래 버튼을 눌러 탱구런으로 돌아가세요.</p>
  <a id="open" class="button" href="#">탱구런 열기</a>
  <small>Tanggu Run Email Login · Studio Sosim</small>
  <script>
    const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
    const query = location.search.startsWith('?') ? location.search.slice(1) : '';
    const payload = [query, hash].filter(Boolean).join('&');
    const params = new URLSearchParams(payload);
    const error = params.get('error_description') || params.get('error');
    const open = document.getElementById('open');
    const message = document.getElementById('message');
    if (error || !params.get('access_token')) {
      message.textContent = error ? decodeURIComponent(error.replace(/\+/g,' ')) : '로그인 링크가 만료되었거나 올바르지 않습니다. 앱에서 새 링크를 요청해 주세요.';
      message.className = 'error'; open.hidden = true;
    } else { open.href = 'tanggurun://login-callback#' + payload; }
  </script>
</main></body></html>
