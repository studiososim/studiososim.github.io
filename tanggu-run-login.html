<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>탱구런 이메일 로그인 · Tanggu Run Email Login</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#174aa6,#55b8eb);color:#17324a}
    main{width:min(86vw,520px);padding:30px 26px;text-align:center;background:#fffdf7;border:5px solid #69bfe4;border-radius:28px;box-shadow:0 16px 45px #092f6b55}
    .mascot{width:112px;height:112px;object-fit:contain;display:block;margin:0 auto 8px}.studio{margin:0 0 5px;font-size:1rem;font-weight:800;color:#52748b;letter-spacing:.06em}h1{margin:0 0 14px}.english{display:block;margin-top:8px}.button{display:block;margin:24px auto 10px;padding:18px 20px;border-radius:18px;background:#78d4ff;color:#17324a;text-decoration:none;font-size:1.2rem;font-weight:800}.button-en{display:block;margin-top:4px;font-size:.82rem;letter-spacing:.04em}.hint{font-weight:700}.error{color:#a22626}small{display:block;margin-top:18px;color:#526b7c}
  </style>
</head>
<body><main>
  <img class="mascot" src="studio-sosim-face.png" alt="Studio Sosim 소심이">
  <p class="studio">STUDIO SOSIM</p>
  <h1>탱구런 이메일 로그인<br><span class="english">Tanggu Run Email Login</span></h1>
  <p id="message">이메일 인증이 완료되었습니다.<span class="english">Email verification is complete.</span></p>
  <p class="hint">아래 버튼을 누르면 탱구런이 열리고 자동으로 로그인됩니다.<span class="english">Tap the button below to open Tanggu Run and sign in automatically.</span></p>
  <a id="open" class="button" href="#">탱구런 열기<span class="button-en">OPEN TANGGU RUN</span></a>
  <small>Tanggu Run Email Login · 스튜디오 소심</small>
  <script>
    const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
    const query = location.search.startsWith('?') ? location.search.slice(1) : '';
    const payload = [query, hash].filter(Boolean).join('&');
    const params = new URLSearchParams(payload);
    const error = params.get('error_description') || params.get('error');
    const open = document.getElementById('open');
    const message = document.getElementById('message');
    if (error || !params.get('access_token')) {
      message.textContent = error ? decodeURIComponent(error.replace(/\+/g,' ')) : '로그인 링크가 만료되었거나 올바르지 않습니다. 앱에서 새 링크를 요청해 주세요. / The login link is invalid or expired. Please request a new link in the app.';
      message.className = 'error';
      open.hidden = true;
    } else {
      open.href = 'tanggurun://login-callback#' + payload;
    }
  </script>
</main></body></html>
